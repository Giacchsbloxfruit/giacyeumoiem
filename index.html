<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Giac's Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:#111;
}

/* =========================
   LIVE WALLPAPER
========================= */

video{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:blur(4px) brightness(0.6) grayscale(40%);
    z-index:-2;
}

/* overlay */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:-1;
}

/* =========================
   CARD
========================= */

.card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:400px;
    padding:35px;
    border-radius:25px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:2px solid rgba(255,255,255,0.8);
    box-shadow:0 0 30px rgba(255,255,255,0.4);

    text-align:center;
    transition:transform 0.1s;
}

/* avatar */
.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    border:2px solid white;
    margin-bottom:15px;
    object-fit:cover;
}

/* text */
h1{
    color:white;
    text-shadow:0 0 10px white;
}

p{
    color:#ccc;
}

/* info box */
.box{
    background:rgba(255,255,255,0.05);
    padding:12px;
    border-radius:12px;
    margin:10px 0;
}

/* social */
.social a{
    margin:12px;
    font-size:24px;
    color:white;
    transition:0.2s;
    display:inline-block;
}

.social a:hover{
    text-shadow:0 0 10px white;
    transform:scale(1.1);
}

/* skill */
.skills{
    margin-top:10px;
}

.skills span{
    display:inline-block;
    margin:5px;
    padding:5px 10px;
    border:1px solid white;
    border-radius:8px;
    font-size:12px;
    color:white;
}

/* nhạc */
audio{
    display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){
    .card{
        width:90%;
        padding:25px;
    }

    .avatar{
        width:100px;
        height:100px;
    }

    .social a{
        margin:8px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LIVE WALLPAPER
========================= -->

<video autoplay muted loop playsinline id="bgVideo">
    <source src="" type="video/mp4">
</video>

<div class="overlay"></div>


<!-- =========================
     PROFILE CARD
========================= -->

<div class="card" id="card">

    <img
        src="https://files.catbox.moe/1hcclk.jpg"
        class="avatar"
        alt="Avatar"
    >

    <h1>Minh Giác</h1>

    <div class="box">
        <p>Dev | Student | Chill</p>
    </div>

    <div class="box">
        <p><b>Biệt danh:</b> Ty</p>
        <p><b>Năm sinh:</b> 2010</p>
        <p><b>Trường:</b> THPT Nguyễn Huệ</p>
    </div>

    <div class="box">
        <p><b>Discord:</b> tyheroday_12345</p>
        <p>"I MISS YOU"</p>
    </div>

    <div class="skills">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
    </div>

    <!-- SOCIAL -->

    <div class="social">

        <a
            href="https://www.facebook.com/share/1DhLrxUrNT/"
            target="_blank"
            rel="noopener"
        >
            <i class="fab fa-facebook"></i>
        </a>

        <a
            href="https://www.tiktok.com/"
            target="_blank"
            rel="noopener"
        >
            <i class="fab fa-tiktok"></i>
        </a>

        <a
            href="https://discord.gg/dRVBQVkN"
            target="_blank"
            rel="noopener"
        >
            <i class="fab fa-discord"></i>
        </a>

    </div>

</div>


<!-- =========================
     NHẠC NỀN
========================= -->

<audio id="bgMusic" autoplay loop>
    <source src="" type="audio/mpeg">
</audio>


<script>

/* =========================================================
   DANH SÁCH LIVE WALLPAPER
   Mỗi lần F5 / truy cập lại web sẽ random 1 video
========================================================= */

const backgrounds = [

    "https://files.catbox.moe/tj9qgh.mp4",
    "https://files.catbox.moe/zz9c19.mp4",
    "https://files.catbox.moe/14xrt8.mp4",
    "https://files.catbox.moe/8irzr4.mp4",

    // Thêm video của boss man ở đây:
    // "https://files.catbox.moe/VIDEO2.mp4",
    // "https://files.catbox.moe/VIDEO3.mp4",
    // "https://files.catbox.moe/VIDEO4.mp4",
    // "https://files.catbox.moe/VIDEO5.mp4",

];


/* =========================================================
   DANH SÁCH NHẠC
   Mỗi lần F5 / truy cập lại web sẽ random 1 bài
========================================================= */

const musics = [

    "https://files.catbox.moe/9gu9lj.mp3",
    "https://files.catbox.moe/22dybh.mp3",
    
    // Thêm nhạc của boss man ở đây:
    // "https://files.catbox.moe/MUSIC2.mp3",
    // "https://files.catbox.moe/MUSIC3.mp3",
    // "https://files.catbox.moe/MUSIC4.mp3",
    // "https://files.catbox.moe/MUSIC5.mp3",

];


/* =========================================================
   HÀM RANDOM
========================================================= */

function randomItem(array){
    return array[Math.floor(Math.random() * array.length)];
}


/* =========================================================
   RANDOM LIVE WALLPAPER
========================================================= */

const bgVideo = document.getElementById("bgVideo");

const randomBackground = randomItem(backgrounds);

bgVideo.src = randomBackground;
bgVideo.load();

bgVideo.play().catch(() => {
    // Giữ nguyên autoplay video muted
});


/* =========================================================
   RANDOM NHẠC
========================================================= */

const bgMusic = document.getElementById("bgMusic");

const randomMusic = randomItem(musics);

bgMusic.src = randomMusic;
bgMusic.load();

/*
   Giữ autoplay như web cũ.
   Không thêm nút nhạc hay thay đổi giao diện.
*/

bgMusic.play().catch(() => {});


/* =========================================================
   XOAY CARD THEO CHUỘT
========================================================= */

const card = document.getElementById("card");

document.addEventListener("mousemove", e => {

    let x =
        (e.pageX - window.innerWidth / 2) / 20;

    let y =
        (e.pageY - window.innerHeight / 2) / 20;

    card.style.transform =
        `translate(-50%,-50%)
         rotateY(${x}deg)
         rotateX(${-y}deg)`;

});


/* =========================================================
   MOBILE
   Nghiêng điện thoại -> card xoay nhẹ
========================================================= */

if(window.DeviceOrientationEvent){

    window.addEventListener("deviceorientation", e => {

        if(e.beta === null || e.gamma === null) return;

        let x = e.gamma / 5;
        let y = e.beta / 10;

        card.style.transform =
            `translate(-50%,-50%)
             rotateY(${x}deg)
             rotateX(${-y}deg)`;

    });

}

</script>

</body>
</html>
